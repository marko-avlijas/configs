# tmux >= 3.2. Lives at ~/.config/tmux/tmux.conf (the whole tmux/ directory of
# this repo is symlinked to ~/.config/tmux). No plugin manager.

# Prefix CTRL j instead of CTRL b; CTRL j twice sends CTRL j to the program
set -g prefix C-j
unbind C-b
bind C-j send-prefix

# Make vim/neovim responsive to ESC
set -sg escape-time 1

# Once I rename a window, don't auto-rename it later
set-option -g allow-rename off

# Windows and panes are numbered from 1
set -g base-index 1
setw -g pane-base-index 1

# Reload the config file with prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded!"

# Lines of scrollback per pane
set-option -g history-limit 20000

# Terminal and colors
# -------------------
# tmux-256color where the system knows it; macOS's own ncurses does not, and
# programs inside tmux (less, clear) would complain about an unknown terminal
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# the outer terminal supports 24-bit color
set -as terminal-features ",*:RGB"
# let neovim know when its pane gains/loses focus (autoread etc.)
set -g focus-events on

# Copy paste
# ----------
# Programs inside tmux may NOT read or set the system clipboard (no OSC 52).
# Only my own copy (y in copy mode) reaches it: pbcopy on macOS, xclip on
# Linux, otherwise it stays in the tmux buffer (prefix P pastes).
set -s set-clipboard off

set-window-option -g mode-keys vi
bind P paste-buffer -p # bracketed paste
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell "command -v xclip >/dev/null" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"
if-shell "command -v pbcopy >/dev/null" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"

# Panes and windows
# -----------------
bind | split-window -h
bind - split-window -v

# Moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Next / previous window: Alt j / Alt k
bind -n M-k select-window -t :-
bind -n M-j select-window -t :+
# macOS: Option+k / Option+j type ˚ and ∆ instead of sending Alt
if-shell '[ "$(uname)" = Darwin ]' 'bind -n ˚ select-window -t :- ; bind -n ∆ select-window -t :+'

# Move current window left / right: prefix, Shift + Left / Right
bind-key S-Left swap-window -t -1
bind-key S-Right swap-window -t +1

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix t clock: 24h
set -g clock-mode-style 24

# Alerts
# ------
# activity in a background window: bold in the status bar + a message
setw -g monitor-activity on
set -g visual-activity on
# a bell (\a) from any window is passed on to the outer terminal, which can
# play a sound; the window is also marked in the status bar
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Status bar (Dracula colors, powerline separators, no plugin)
# ------------------------------------------------------------
%hidden WHITE="#f8f8f2"
%hidden GRAY="#44475a"
%hidden DARK_GRAY="#282a36"
%hidden LIGHT_PURPLE="#bd93f9"
%hidden DARK_PURPLE="#6272a4"
%hidden CYAN="#8be9fd"
%hidden GREEN="#50fa7b"
%hidden PINK="#ff79c6"
%hidden YELLOW="#f1fa8c"
# powerline glyphs: needs a Powerline/Nerd Font in the terminal
%hidden SEP_L="\uE0B0"
%hidden SEP_R="\uE0B2"
# prints battery / network text, or nothing
%hidden INFO="~/.config/tmux/status-info.sh"

set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=$GRAY,fg=$WHITE"
set -g message-style "bg=$GRAY,fg=$WHITE"
set -g pane-border-style "fg=$GRAY"
set -g pane-active-border-style "fg=$LIGHT_PURPLE"

# left: session name, green; yellow while the prefix is pressed
set -g status-left "#[bg=$GREEN,fg=$DARK_GRAY]#{?client_prefix,#[bg=$YELLOW],} #S #[fg=$GREEN,bg=$GRAY]#{?client_prefix,#[fg=$YELLOW],}$SEP_L"

# windows: current one purple, others gray; activity / bell in bold
setw -g window-status-format "#[fg=$WHITE,bg=$GRAY] #I #W"
setw -g window-status-current-format "#[fg=$GRAY,bg=$DARK_PURPLE]$SEP_L#[fg=$WHITE,bg=$DARK_PURPLE] #I #W #[fg=$DARK_PURPLE,bg=$GRAY]$SEP_L"
setw -g window-status-activity-style "bold"
setw -g window-status-bell-style "bold"

# right: battery (pink), network (cyan), host name (purple). A segment whose
# script prints nothing (no battery in a VM) is left out.
# Inside #{?...} never write a comma, also not in #[fg=..,bg=..]: tmux splits
# on it (newer versions even in the last branch). Use #[fg=..]#[bg=..].
set -g status-right "\
#{?#{==:#($INFO battery),},,#[fg=$PINK]#[bg=$GRAY]$SEP_R#[fg=$DARK_GRAY]#[bg=$PINK] #($INFO battery) }\
#[fg=$CYAN]#{?#{==:#($INFO battery),},#[bg=$GRAY],#[bg=$PINK]}$SEP_R#[fg=$DARK_GRAY,bg=$CYAN] #($INFO network) \
#[fg=$DARK_PURPLE,bg=$CYAN]$SEP_R#[fg=$WHITE,bg=$DARK_PURPLE] #h "

# Save / restore sessions: tmux-resurrect (no tpm)
# ------------------------------------------------
# prefix CTRL s saves, prefix CTRL r restores. Saves window/pane layout, working
# directories and the programs running in them (their full command lines!) to
# ~/.local/share/tmux/resurrect. Pane contents are NOT saved (option left off).
# Neovim is reopened with its Session.vim when that file exists in the pane's
# directory. Install it with ~/.config/tmux/install-resurrect.sh (pinned
# commit); skipped if missing.
set -g @resurrect-strategy-nvim 'session'
%hidden RESURRECT="~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f $RESURRECT" "run-shell $RESURRECT"
